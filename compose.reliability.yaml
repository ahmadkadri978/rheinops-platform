services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: reliability
      RHEINOPS_DB_URL: jdbc:postgresql://toxiproxy:15432/${RHEINOPS_DB_NAME:-rheinops}
      RHEINOPS_ENVIRONMENT: reliability-lab
      RHEINOPS_OTLP_TRACING_ENABLED: "true"
      RHEINOPS_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      RHEINOPS_RATE_LIMIT_CAPACITY: "100000"
      RHEINOPS_RATE_LIMIT_REFILL_TOKENS: "100000"
    depends_on:
      toxiproxy-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8474:8474"
    restart: unless-stopped

  toxiproxy-init:
    image: curlimages/curl:8.15.0
    depends_on:
      toxiproxy:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      until curl --fail --silent http://toxiproxy:8474/version >/dev/null; do sleep 1; done;
      if ! curl --fail --silent http://toxiproxy:8474/proxies/rheinops-postgres >/dev/null; then
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies
        -H 'Content-Type: application/json'
        -d '{"name":"rheinops-postgres","listen":"0.0.0.0:15432","upstream":"postgres:5432","enabled":true}';
      fi
    restart: "no"

  tempo:
    image: grafana/tempo:2.10.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${RHEINOPS_GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${RHEINOPS_GRAFANA_ADMIN_PASSWORD:-admin-demo-only}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  k6:
    image: grafana/k6:1.7.1
    profiles: ["load"]
    environment:
      RHEINOPS_BASE_URL: http://api:8080
      RHEINOPS_TOKEN_URL: http://keycloak:8080/realms/rheinops/protocol/openid-connect/token
      RHEINOPS_USERNAME: viewer
      RHEINOPS_PASSWORD: viewer-demo
    volumes:
      - ./infra/load/k6:/scripts:ro
    depends_on:
      api:
        condition: service_started

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
