name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-assets:
    name: Validate reliability assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Validate Compose model and configuration files
        run: |
          docker compose -f compose.yaml -f compose.reliability.yaml config --quiet
          jq --exit-status empty infra/observability/grafana/dashboards/rheinops-overview.json
          sh -n scripts/reliability/*.sh

      - name: Validate Prometheus configuration and rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.12.0
          check config /etc/prometheus/prometheus.yml

      - name: Validate k6 scenarios
        run: |
          docker run --rm -v "$PWD/infra/load/k6:/scripts:ro" grafana/k6:1.7.1 inspect /scripts/steady-state.js
          docker run --rm -v "$PWD/infra/load/k6:/scripts:ro" grafana/k6:1.7.1 inspect /scripts/spike.js

  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit, architecture, and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build production container
    needs: [verify, reliability-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image without publishing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          tags: rheinops-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
