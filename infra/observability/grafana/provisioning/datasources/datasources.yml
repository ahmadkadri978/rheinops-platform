apiVersion: 1

datasources:
  - name: RheinOps Prometheus
    uid: rheinops-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: rheinops-tempo

  - name: RheinOps Tempo
    uid: rheinops-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: rheinops-prometheus
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: rheinops-prometheus
      nodeGraph:
        enabled: true
