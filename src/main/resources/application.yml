spring:
  application:
    name: rheinops-platform
  datasource:
    url: ${RHEINOPS_DB_URL:jdbc:postgresql://localhost:5432/rheinops}
    username: ${RHEINOPS_DB_USER:rheinops}
    password: ${RHEINOPS_DB_PASSWORD:rheinops_dev}
    hikari:
      maximum-pool-size: ${RHEINOPS_DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      enabled: false

server:
  port: ${RHEINOPS_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${RHEINOPS_OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${RHEINOPS_OPENAPI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  observations:
    annotations:
      enabled: true

info:
  app:
    name: RheinOps Platform
    description: Service operations, incident, and customer support platform
    version: "@project.version@"

logging:
  pattern:
    correlation: "[%X{correlationId:-no-correlation-id}] "

rheinops:
  security:
    jwt:
      issuer-uri: ${RHEINOPS_JWT_ISSUER_URI:http://localhost:8090/realms/rheinops}
      jwk-set-uri: ${RHEINOPS_JWT_JWK_SET_URI:http://localhost:8090/realms/rheinops/protocol/openid-connect/certs}
      audience: ${RHEINOPS_JWT_AUDIENCE:rheinops-api}
    rate-limit:
      enabled: ${RHEINOPS_RATE_LIMIT_ENABLED:true}
      capacity: ${RHEINOPS_RATE_LIMIT_CAPACITY:120}
      refill-tokens: ${RHEINOPS_RATE_LIMIT_REFILL_TOKENS:120}
      refill-period: ${RHEINOPS_RATE_LIMIT_REFILL_PERIOD:1m}
      max-clients: ${RHEINOPS_RATE_LIMIT_MAX_CLIENTS:10000}
      expire-after-access: ${RHEINOPS_RATE_LIMIT_EXPIRE_AFTER_ACCESS:10m}
  support:
    sla-evaluation-interval: ${RHEINOPS_SLA_EVALUATION_INTERVAL:60000}
