spring:
  config:
    activate:
      on-profile: prod

server:
  forward-headers-strategy: none
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${RHEINOPS_TRACE_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${RHEINOPS_OTLP_TRACING_ENABLED:false}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: rheinops-platform
        version: "@project.version@"
        environment: ${RHEINOPS_ENVIRONMENT:production}

rheinops:
  security:
    jwt:
      issuer-uri: ${RHEINOPS_JWT_ISSUER_URI}
      jwk-set-uri: ${RHEINOPS_JWT_JWK_SET_URI}
      audience: ${RHEINOPS_JWT_AUDIENCE:rheinops-api}
    rate-limit:
      enabled: true
