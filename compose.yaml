name: rheinops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RHEINOPS_DB_NAME:-rheinops}
      POSTGRES_USER: ${RHEINOPS_DB_USER:-rheinops}
      POSTGRES_PASSWORD: ${RHEINOPS_DB_PASSWORD:-rheinops_dev}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${RHEINOPS_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RHEINOPS_KEYCLOAK_ADMIN_PASSWORD:-admin-demo-only}
      KC_HOSTNAME: http://localhost:8090
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./infra/keycloak/rheinops-realm.json:/opt/keycloak/data/import/rheinops-realm.json:ro
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      RHEINOPS_DB_URL: jdbc:postgresql://postgres:5432/${RHEINOPS_DB_NAME:-rheinops}
      RHEINOPS_DB_USER: ${RHEINOPS_DB_USER:-rheinops}
      RHEINOPS_DB_PASSWORD: ${RHEINOPS_DB_PASSWORD:-rheinops_dev}
      RHEINOPS_SERVER_PORT: ${RHEINOPS_SERVER_PORT:-8080}
      RHEINOPS_JWT_ISSUER_URI: http://localhost:8090/realms/rheinops
      RHEINOPS_JWT_JWK_SET_URI: http://keycloak:8080/realms/rheinops/protocol/openid-connect/certs
      RHEINOPS_JWT_AUDIENCE: rheinops-api
      RHEINOPS_OPENAPI_ENABLED: "true"
    ports:
      - "127.0.0.1:${RHEINOPS_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
