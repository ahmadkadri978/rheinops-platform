name: rheinops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RHEINOPS_DB_NAME:-rheinops}
      POSTGRES_USER: ${RHEINOPS_DB_USER:-rheinops}
      POSTGRES_PASSWORD: ${RHEINOPS_DB_PASSWORD:-rheinops_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      RHEINOPS_DB_URL: jdbc:postgresql://postgres:5432/${RHEINOPS_DB_NAME:-rheinops}
      RHEINOPS_DB_USER: ${RHEINOPS_DB_USER:-rheinops}
      RHEINOPS_DB_PASSWORD: ${RHEINOPS_DB_PASSWORD:-rheinops_dev}
      RHEINOPS_SERVER_PORT: ${RHEINOPS_SERVER_PORT:-8080}
    ports:
      - "${RHEINOPS_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
